name: Release

# A pull request MERGED into master cuts a release IFF the VERSION file names
# a version that has not been tagged yet. A direct push to master, or a PR
# that is closed without merging, does nothing.

on:
  pull_request:
    types: [closed]
    branches: [master]

permissions:
  contents: write

concurrency:
  group: release-master
  cancel-in-progress: false

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: macos-15
    steps:
      # Check out the base branch, not the PR ref: the tag must point at the
      # squash-merge commit that is now master's head.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0

      - name: Read and validate VERSION
        id: ver
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION '$VERSION' is not semver (x.y.z)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Skip if this version is already released
        id: guard
        run: |
          if git rev-parse "v${{ steps.ver.outputs.version }}" >/dev/null 2>&1; then
            echo "v${{ steps.ver.outputs.version }} already released — nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run tests
        if: steps.guard.outputs.skip == 'false'
        run: swift test

      - name: Build universal app
        if: steps.guard.outputs.skip == 'false'
        run: Scripts/make-app.sh --universal

      - name: Package
        if: steps.guard.outputs.skip == 'false'
        run: ditto -c -k --keepParent build/DayPeek.app "DayPeek-${{ steps.ver.outputs.version }}.zip"

      - name: Build release notes
        if: steps.guard.outputs.skip == 'false'
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          # Pull the CHANGELOG section for this version (between its heading and the next).
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {grab=1; next}
            grab && /^## \[/ {exit}
            grab {print}
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "Release v$VERSION." > notes.md
          fi
          {
            echo ""
            echo "## Install"
            echo ""
            echo "1. Download \`DayPeek-$VERSION.zip\` below and unzip it."
            echo "2. Move \`DayPeek.app\` to \`/Applications\`."
            echo "3. Open \`DayPeek.app\` and allow Reminders access when asked."
            echo ""
            echo "> [!NOTE]"
            echo "> On first launch, macOS may warn that it *\"could not verify DayPeek is free of malware\"*. **This is expected and the app is completely safe** — DayPeek is open source and built by GitHub Actions straight from this repository, but it is not notarized by Apple (notarization requires a paid developer account, which this project doesn't have). The warning only offers **Done** and **Move to Bin**, so:"
            echo ">"
            echo "> 1. Click **Done** (not Move to Bin)."
            echo "> 2. Open **System Settings → Privacy & Security**, scroll down to *\"DayPeek\" was blocked to protect your Mac*, and click **Open Anyway**."
            echo "> 3. Confirm, and DayPeek launches. This is needed only once."
            echo ">"
            echo "> Alternatively, run \`xattr -d com.apple.quarantine /Applications/DayPeek.app\` in Terminal and open the app normally."
            echo ""
            echo "DayPeek requests **one permission** — Reminders — and makes **no network connections**, ever."
          } >> notes.md

      - name: Tag and release
        if: steps.guard.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "DayPeek v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" "DayPeek-$VERSION.zip" \
            --title "DayPeek v$VERSION" \
            --latest \
            --notes-file notes.md
